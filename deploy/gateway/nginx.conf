# The platform's single address on the LAN (see docs/LAN_Deployment_Standard.md):
#   /            the Admin Portal, at its own pages (listed below)
#   /api/        the Platform API (the prefix is stripped)
#   /{app}/      every other path: deployed applications, by name, through
#                the platform's own proxy — /{app}/ is the frontend,
#                /{app}/{service}/ any other service
#   /run/        the long form of the same, /run/{app}/{service}/
#   /downloads/  what a Claude Code machine installs, with this address
#                filled in so the installer needs no arguments
server {
    listen 80;
    server_name _;

    # Build uploads go up to the Platform API's 50 MiB limit.
    client_max_body_size 64m;

    location ^~ /api/ {
        proxy_pass http://platform-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A deploy runs synchronously: build, image scan and health check.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location ^~ /run/ {
        proxy_pass http://platform-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A scaled-to-zero application cold-starts on its first request.
        proxy_read_timeout 300s;
    }

    location ^~ /downloads/ {
        root /usr/share/nginx;
        types {
            text/plain      ps1 sh txt;
            application/zip zip;
        }
        default_type application/octet-stream;
        # The installers carry this platform's own address, as the machine
        # downloading them reached it.
        sub_filter_types text/plain;
        sub_filter '__PLATFORM_URL__' '$scheme://$http_host';
        sub_filter_once off;
        add_header Cache-Control "no-store";
    }

    # The Admin Portal: its home, its files, and each of its pages (a
    # single-page app, so every page is index.html). These names are
    # reserved: no application can be called any of them — keep this list,
    # the Portal's routes (apps/admin-portal/src/App.tsx) and
    # reservedApplicationNames (platform-api) in step.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
    location ~ ^/(assets|sign-in|register|device|access-keys|applications|notifications|reports|audit-log|dashboard|departments|approvals)(/|$) {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
    # Files at the root (favicon.svg). Application names have no dot.
    location ~ ^/[^/]+\.[A-Za-z0-9]+$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Everything else is an application, by name.
    location / {
        proxy_pass http://platform-api:8080/app/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A scaled-to-zero application cold-starts on its first request.
        proxy_read_timeout 300s;
    }
}
