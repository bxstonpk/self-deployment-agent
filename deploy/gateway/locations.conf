# What the platform's address serves, the same over HTTP and HTTPS
# (nginx.conf, https.conf.template). See nginx.conf for the map.

# Build uploads go up to the Platform API's 50 MiB limit.
client_max_body_size 64m;

location ^~ /api/ {
    proxy_pass http://platform-api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A deploy runs synchronously: build, image scan and health check.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}

location ^~ /run/ {
    proxy_pass http://platform-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A scaled-to-zero application cold-starts on its first request.
    proxy_read_timeout 300s;
}

# The company CA that signed the HTTPS certificate (deploy/gateway/make-cert.sh),
# for a machine or browser to trust once. Only this one file of the TLS
# directory is served; the CA's private key is never in this container.
location = /downloads/company-platform-ca.crt {
    alias /etc/nginx/tls/ca.crt;
    default_type application/x-x509-ca-cert;
    add_header Cache-Control "no-store";
}

# The Admin Portal: its home, its files, and each of its pages (a
# single-page app, so every page is index.html). These names are
# reserved: no application can be called any of them — keep this list,
# the Portal's routes (apps/admin-portal/src/App.tsx) and
# reservedApplicationNames (platform-api) in step.
location = / {
    root /usr/share/nginx/html;
    try_files /index.html =404;
}
location ~ ^/(assets|sign-in|register|device|access-keys|applications|notifications|reports|audit-log|dashboard|departments|approvals|standards)(/|$) {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
}
# Files at the root (favicon.svg). Application names have no dot.
location ~ ^/[^/]+\.[A-Za-z0-9]+$ {
    root /usr/share/nginx/html;
    try_files $uri =404;
}

# Everything else is an application, by name.
location / {
    proxy_pass http://platform-api:8080/app/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A scaled-to-zero application cold-starts on its first request.
    proxy_read_timeout 300s;
}
