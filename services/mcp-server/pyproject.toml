[project]
name = "company-deployment-mcp"
version = "0.1.0"
description = "Company Deployment MCP server — Module Y (docs/02_Functional_Requirements.md), the business-capability interface between Claude Code and the Company Platform API"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.1.1,<3",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
]

[project.scripts]
company-deployment-mcp = "mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
